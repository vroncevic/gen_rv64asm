name: gen_rv64asm_isp_checker

permissions:
  contents: read

on:
  push:
    branches: [ master, main ]
    paths:
      - 'gen_rv64asm/**/*.py'
      - 'setup.py'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'gen_rv64asm/**/*.py'
      - 'setup.py'

jobs:
  isp_gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Check Interface Segregation Principle violations
        run: |
          python3 gates/gates/isp_checker.py gen_rv64asm
